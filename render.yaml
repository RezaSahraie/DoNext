services:
  - type: web
    name: donext
    runtime: docker
    plan: starter
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: DoNext
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: donext-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: donext-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: donext-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: donext-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: donext-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: donext-db
    plan: starter
    databaseName: donext
    user: donext
